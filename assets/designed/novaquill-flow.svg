<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="324" viewBox="0 0 1000 324" role="img" aria-labelledby="title"><title id="title">NovaQuill: topic, research, generate, review, export</title><style>text{font-family:Arial,Helvetica,sans-serif} .signal{fill:none;stroke:#eee;stroke-width:2;stroke-dasharray:16 84;animation:travel 5s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:100;opacity:0}15%,80%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.65}}</style><rect x="0" y="0" width="1000" height="324" rx="18" fill="#111315"/><rect x=".5" y=".5" width="999" height="323" rx="17.5" fill="none" stroke="#36393d"/><text x="28" y="36" fill="#aeb3ba" font-size="12" font-weight="600" letter-spacing="2">INSIDE NOVAQUILL</text><text x="28" y="76" fill="#fff" font-size="31" font-weight="700" >From a topic to a finished ebook.</text><path d="M198 183H218" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M198 183H218" style="animation-delay:-0s"/><rect x="28" y="131" width="170" height="104" rx="12" fill="#202327"/><text x="46" y="162" fill="#f1f3f5" font-size="21" font-weight="700" >Topic</text><text x="46" y="188" fill="#b9bfc7" font-size="13" font-weight="400" >Choose a niche</text><path d="M388 183H408" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M388 183H408" style="animation-delay:-1s"/><rect x="218" y="131" width="170" height="104" rx="12" fill="#202327"/><text x="236" y="162" fill="#f1f3f5" font-size="21" font-weight="700" >Research</text><text x="236" y="188" fill="#b9bfc7" font-size="13" font-weight="400" >Analyse the opportunity</text><path d="M578 183H598" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M578 183H598" style="animation-delay:-2s"/><rect x="408" y="131" width="170" height="104" rx="12" fill="#202327"/><text x="426" y="162" fill="#f1f3f5" font-size="21" font-weight="700" >Generate</text><text x="426" y="188" fill="#b9bfc7" font-size="13" font-weight="400" >Build the chapters</text><path d="M768 183H788" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M768 183H788" style="animation-delay:-3s"/><rect x="598" y="131" width="170" height="104" rx="12" fill="#202327"/><text x="616" y="162" fill="#f1f3f5" font-size="21" font-weight="700" >Review</text><text x="616" y="188" fill="#b9bfc7" font-size="13" font-weight="400" >Check the content</text><rect x="788" y="131" width="170" height="104" rx="12" fill="#eceff2"/><text x="806" y="162" fill="#16191c" font-size="21" font-weight="700" >Export</text><text x="806" y="188" fill="#4b5159" font-size="13" font-weight="400" >PDF · DOCX · EPUB</text><text x="28" y="299" fill="#aeb3ba" font-size="16" font-weight="400" >Accounts, subscriptions and plan limits surround the workflow.</text></svg>