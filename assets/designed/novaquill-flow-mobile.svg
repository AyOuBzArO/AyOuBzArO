<svg xmlns="http://www.w3.org/2000/svg" width="500" height="650" viewBox="0 0 500 650" role="img" aria-labelledby="title"><title id="title">NovaQuill: topic, research, generate, review, export</title><style>text{font-family:Arial,Helvetica,sans-serif} .signal{fill:none;stroke:#eee;stroke-width:2;stroke-dasharray:16 84;animation:travel 5s ease-in-out infinite}@keyframes travel{0%{stroke-dashoffset:100;opacity:0}15%,80%{opacity:1}100%{stroke-dashoffset:-100;opacity:0}}@media(prefers-reduced-motion:reduce){.signal{animation:none;stroke-dasharray:none;opacity:.65}}</style><rect x="0" y="0" width="500" height="650" rx="18" fill="#111315"/><rect x=".5" y=".5" width="499" height="649" rx="17.5" fill="none" stroke="#36393d"/><text x="28" y="36" fill="#aeb3ba" font-size="12" font-weight="600" letter-spacing="2">INSIDE NOVAQUILL</text><text x="28" y="76" fill="#fff" font-size="25" font-weight="700" >From a topic to a finished ebook.</text><path d="M250 182V206" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M250 182V206" style="animation-delay:-0s"/><rect x="28" y="108" width="444" height="74" rx="12" fill="#202327"/><text x="46" y="139" fill="#f1f3f5" font-size="21" font-weight="700" >Topic</text><text x="46" y="165" fill="#b9bfc7" font-size="17" font-weight="400" >Choose a niche</text><path d="M250 280V304" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M250 280V304" style="animation-delay:-1s"/><rect x="28" y="206" width="444" height="74" rx="12" fill="#202327"/><text x="46" y="237" fill="#f1f3f5" font-size="21" font-weight="700" >Research</text><text x="46" y="263" fill="#b9bfc7" font-size="17" font-weight="400" >Analyse the opportunity</text><path d="M250 378V402" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M250 378V402" style="animation-delay:-2s"/><rect x="28" y="304" width="444" height="74" rx="12" fill="#202327"/><text x="46" y="335" fill="#f1f3f5" font-size="21" font-weight="700" >Generate</text><text x="46" y="361" fill="#b9bfc7" font-size="17" font-weight="400" >Build the chapters</text><path d="M250 476V500" fill="none" stroke="#555" stroke-width="2"/><path class="signal" pathLength="100" d="M250 476V500" style="animation-delay:-3s"/><rect x="28" y="402" width="444" height="74" rx="12" fill="#202327"/><text x="46" y="433" fill="#f1f3f5" font-size="21" font-weight="700" >Review</text><text x="46" y="459" fill="#b9bfc7" font-size="17" font-weight="400" >Check the content</text><rect x="28" y="500" width="444" height="74" rx="12" fill="#eceff2"/><text x="46" y="531" fill="#16191c" font-size="21" font-weight="700" >Export</text><text x="46" y="557" fill="#4b5159" font-size="17" font-weight="400" >PDF · DOCX · EPUB</text><text x="28" y="625" fill="#aeb3ba" font-size="14" font-weight="400" >Accounts, subscriptions and plan limits surround the workflow.</text></svg>