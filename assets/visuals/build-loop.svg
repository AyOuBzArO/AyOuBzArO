<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Ayoub Zarkouni product delivery loop</title>
  <desc id="desc">An animated six-step loop from discovery through continuous improvement.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#181a1f"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#56ccf2"/>
      <stop offset="1" stop-color="#2f80ed"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#fff" stroke-opacity=".035"/>
    </pattern>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .eyebrow{font:700 13px 'Segoe UI',Arial,sans-serif;letter-spacing:4px;fill:#56ccf2}
      .headline{font:800 34px 'Segoe UI',Arial,sans-serif;letter-spacing:-1px;fill:#f5f7fa}
      .copy{font:400 15px 'Segoe UI',Arial,sans-serif;fill:#8a8f98}
      .step{font:800 15px 'Segoe UI',Arial,sans-serif;letter-spacing:1px;fill:#f5f7fa}
      .detail{font:400 12px 'Segoe UI',Arial,sans-serif;fill:#8a8f98}
      .number{font:800 13px 'Segoe UI',Arial,sans-serif;fill:#08090a}
      .route{stroke-dasharray:10 12;animation:route 7s linear infinite}
      .pulse{animation:pulse 1.8s ease-in-out infinite;transform-origin:center}
      @keyframes route{to{stroke-dashoffset:-154}}
      @keyframes pulse{50%{opacity:.35;transform:scale(.78)}}
      @media (prefers-reduced-motion:reduce){.route,.pulse{animation:none}.motion-dot{display:none}}
    </style>
  </defs>
  <rect width="1200" height="390" rx="28" fill="#050607"/>
  <rect x="1" y="1" width="1198" height="388" rx="27" fill="none" stroke="#2b2f36"/>
  <rect width="1200" height="390" rx="28" fill="url(#grid)"/>
  <path d="M0 320L280 40H390L40 390H0Z" fill="#fff" opacity=".025"/>
  <text x="54" y="62" class="eyebrow">THE BUILD LOOP</text>
  <text x="54" y="104" class="headline">From a real problem to reliable software.</text>
  <text x="54" y="133" class="copy">A deliberate product cycle—not a pile of disconnected features.</text>

  <path id="routePath" d="M116 237 C270 176 354 298 512 237 S754 176 912 237 S1040 250 1092 205" fill="none" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" class="route"/>
  <path d="M116 237 C270 176 354 298 512 237 S754 176 912 237 S1040 250 1092 205" fill="none" stroke="#56ccf2" stroke-opacity=".12" stroke-width="13" stroke-linecap="round"/>
  <circle r="7" fill="#fff" filter="url(#glow)" class="motion-dot">
    <animateMotion dur="7s" repeatCount="indefinite" rotate="auto"><mpath href="#routePath"/></animateMotion>
  </circle>

  <g transform="translate(58 185)">
    <rect width="178" height="126" rx="18" fill="url(#panel)" stroke="#343943"/>
    <circle cx="28" cy="28" r="16" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">01</text>
    <text x="22" y="75" class="step">DISCOVER</text><text x="22" y="99" class="detail">Goals · users · constraints</text>
  </g>
  <g transform="translate(240 218)">
    <rect width="178" height="126" rx="18" fill="url(#panel)" stroke="#343943"/>
    <circle cx="28" cy="28" r="16" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">02</text>
    <text x="22" y="75" class="step">DESIGN</text><text x="22" y="99" class="detail">Flow · system · interface</text>
  </g>
  <g transform="translate(422 185)">
    <rect width="178" height="126" rx="18" fill="url(#panel)" stroke="#343943"/>
    <circle cx="28" cy="28" r="16" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">03</text>
    <text x="22" y="75" class="step">BUILD</text><text x="22" y="99" class="detail">Frontend · API · data</text>
  </g>
  <g transform="translate(604 218)">
    <rect width="178" height="126" rx="18" fill="url(#panel)" stroke="#343943"/>
    <circle cx="28" cy="28" r="16" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">04</text>
    <text x="22" y="75" class="step">VALIDATE</text><text x="22" y="99" class="detail">Tests · quality · security</text>
  </g>
  <g transform="translate(786 185)">
    <rect width="178" height="126" rx="18" fill="url(#panel)" stroke="#343943"/>
    <circle cx="28" cy="28" r="16" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">05</text>
    <text x="22" y="75" class="step">SHIP</text><text x="22" y="99" class="detail">Deploy · observe · support</text>
  </g>
  <g transform="translate(968 152)">
    <rect width="178" height="126" rx="18" fill="url(#panel)" stroke="#343943"/>
    <circle cx="28" cy="28" r="16" fill="url(#accent)"/><text x="28" y="33" text-anchor="middle" class="number">06</text>
    <text x="22" y="75" class="step">IMPROVE</text><text x="22" y="99" class="detail">Measure · learn · iterate</text>
  </g>
  <circle cx="1132" cy="50" r="12" fill="#2f80ed" class="pulse"/>
  <circle cx="1160" cy="50" r="5" fill="#56ccf2" opacity=".5"/>
</svg>
