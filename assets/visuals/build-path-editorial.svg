<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">A deliberate product path</title>
  <desc id="desc">An animated hand-drawn path from understanding a problem through shipping and improvement.</desc>
  <defs>
    <pattern id="paperGrain" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="4" cy="7" r=".65" fill="#171513" opacity=".08"/><circle cx="20" cy="19" r=".45" fill="#171513" opacity=".065"/></pattern>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#3d3028" flood-opacity=".16"/></filter>
    <style>
      .display{font-family:Georgia,'Times New Roman',serif;font-weight:700;fill:#171513}
      .label{font-family:'Trebuchet MS',sans-serif;font-size:13px;font-weight:700;letter-spacing:2px;fill:#171513}
      .copy{font-family:'Trebuchet MS',sans-serif;font-size:12px;fill:#756a61}
      .light{fill:#f1ede7}.lightcopy{fill:#d6cabc}
      .route{stroke-dasharray:1700;stroke-dashoffset:0;animation:route 11s cubic-bezier(.32,.72,0,1) infinite}
      .node{animation:node 11s cubic-bezier(.32,.72,0,1) infinite}
      .n2{animation-delay:.25s}.n3{animation-delay:.5s}.n4{animation-delay:.75s}.n5{animation-delay:1s}
      .stamp{transform-origin:1065px 63px;animation:stamp 11s cubic-bezier(.22,1,.36,1) infinite}
      @keyframes route{0%,4%{stroke-dashoffset:1700;opacity:.2}31%,90%{stroke-dashoffset:0;opacity:1}98%,100%{stroke-dashoffset:0;opacity:.15}}
      @keyframes node{0%,7%{opacity:0;transform:translateY(12px)}18%,91%{opacity:1;transform:translateY(0)}98%,100%{opacity:0;transform:translateY(-5px)}}
      @keyframes stamp{0%,22%{opacity:0;transform:scale(1.45) rotate(-8deg)}31%,91%{opacity:1;transform:scale(1) rotate(-8deg)}98%,100%{opacity:0;transform:scale(.95) rotate(-8deg)}}
      @media (prefers-reduced-motion:reduce){.route,.node,.stamp{animation:none;opacity:1;transform:none}.route{stroke-dashoffset:0}}
    </style>
  </defs>
  <rect width="1200" height="360" rx="28" fill="#f1ede7"/>
  <rect x="2" y="2" width="1196" height="356" rx="26" fill="none" stroke="#c5b8aa" stroke-width="4"/>
  <rect width="1200" height="360" rx="28" fill="url(#paperGrain)"/>
  <text x="52" y="54" class="label" fill="#8f725e">THE PRODUCT PATH</text>
  <text x="52" y="98" class="display" font-size="34">Understand deeply. Build deliberately. Improve continuously.</text>
  <path class="route" d="M91 235C190 160 290 303 389 224s198-66 296 4 205 66 414-51" fill="none" stroke="#8f725e" stroke-width="6" stroke-linecap="round"/>
  <path class="route" d="M91 242C194 172 292 312 392 232s198-66 297 4 205 66 415-51" fill="none" stroke="#171513" stroke-width="2.2" stroke-linecap="round" opacity=".88"/>
  <g class="node" transform="translate(53 169)" filter="url(#shadow)"><circle cx="44" cy="44" r="43" fill="#171513"/><text x="44" y="39" text-anchor="middle" class="label light">01</text><text x="44" y="58" text-anchor="middle" class="copy lightcopy">LISTEN</text><text x="2" y="112" class="copy">People · goals · constraints</text></g>
  <g class="node n2" transform="translate(274 206)" filter="url(#shadow)"><circle cx="44" cy="44" r="43" fill="#b69d83"/><text x="44" y="39" text-anchor="middle" class="label">02</text><text x="44" y="58" text-anchor="middle" class="copy" fill="#171513">SHAPE</text><text x="-7" y="112" class="copy">Flow · system · interface</text></g>
  <g class="node n3" transform="translate(501 168)" filter="url(#shadow)"><circle cx="44" cy="44" r="43" fill="#171513"/><text x="44" y="39" text-anchor="middle" class="label light">03</text><text x="44" y="58" text-anchor="middle" class="copy lightcopy">BUILD</text><text x="0" y="112" class="copy">Frontend · API · data</text></g>
  <g class="node n4" transform="translate(728 205)" filter="url(#shadow)"><circle cx="44" cy="44" r="43" fill="#b69d83"/><text x="44" y="39" text-anchor="middle" class="label">04</text><text x="44" y="58" text-anchor="middle" class="copy" fill="#171513">PROVE</text><text x="-4" y="112" class="copy">Tests · quality · feedback</text></g>
  <g class="node n5" transform="translate(953 156)" filter="url(#shadow)"><circle cx="44" cy="44" r="43" fill="#171513"/><text x="44" y="39" text-anchor="middle" class="label light">05</text><text x="44" y="58" text-anchor="middle" class="copy lightcopy">SHIP</text><text x="-2" y="112" class="copy">Deploy · observe · improve</text></g>
  <g class="stamp" transform="translate(1027 112) rotate(-8)"><rect width="122" height="61" rx="8" fill="none" stroke="#8f725e" stroke-width="3"/><text x="61" y="28" text-anchor="middle" class="label" fill="#8f725e">BUILT FOR</text><text x="61" y="46" text-anchor="middle" class="copy" fill="#8f725e">THE REAL WORLD</text></g>
</svg>
